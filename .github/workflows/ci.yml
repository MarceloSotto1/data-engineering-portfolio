name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CI usa datos sintéticos: rápido, determinista y sin depender de APIs externas.
      - name: Ingest sample data
        run: make ingest-sample START=2024-01 END=2024-02

      - name: dbt deps
        run: make deps

      - name: dbt build (models + seeds + tests)
        run: make build START=2024-01 END=2024-02

      - name: Validate warehouse
        run: make validate

      - name: Generate docs
        run: make docs

      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            dbt_project/target/index.html
            dbt_project/target/manifest.json
            dbt_project/target/catalog.json
