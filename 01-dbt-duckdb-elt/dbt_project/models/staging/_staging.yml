version: 2

models:
  - name: stg_taxi_trips
    description: "Viajes de taxi tipados, acotados al rango de fechas y deduplicados."
    columns:
      - name: trip_id
        description: "Clave surrogate (hash de campos naturales)."
        data_tests: [unique, not_null]
      - name: pickup_at
        data_tests: [not_null]
      - name: pickup_zone_id
        data_tests: [not_null]

  - name: stg_taxi_zones
    description: "Catálogo de zonas de taxi."
    columns:
      - name: location_id
        data_tests: [unique, not_null]

  - name: stg_weather_hourly
    description: "Clima horario de NYC con categoría simplificada."
    columns:
      - name: observed_at
        data_tests: [unique, not_null]
      - name: weather_category
        data_tests:
          - accepted_values:
              arguments:
                values: [clear, cloudy, fog, rain, snow, thunderstorm, unknown]
