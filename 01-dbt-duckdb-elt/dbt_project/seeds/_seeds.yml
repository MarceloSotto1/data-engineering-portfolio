version: 2

seeds:
  - name: payment_types
    description: "Diccionario de tipos de pago del TLC Data Dictionary."
    columns:
      - name: payment_type_id
        data_tests: [unique, not_null]
  - name: rate_codes
    description: "Diccionario de tarifas (RatecodeID) del TLC Data Dictionary."
    columns:
      - name: rate_code_id
        data_tests: [unique, not_null]
  - name: wmo_weather_codes
    description: "Códigos WMO de Open-Meteo agrupados en categorías de clima simples."
    columns:
      - name: weather_code
        data_tests: [unique, not_null]
      - name: weather_category
        data_tests:
          - accepted_values:
              arguments:
                values: [clear, cloudy, fog, rain, snow, thunderstorm]
